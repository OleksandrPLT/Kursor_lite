{{define "oauth_consent"}}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{t .Lang "oauth.consent_title"}} · Kursor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);
  background-image: radial-gradient(circle at 50% 34%, rgba(255,213,0,0.12), transparent 55%), radial-gradient(var(--border) 1px, transparent 1px);
  background-size: auto, 26px 26px;">
  <div style="width:420px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:32px; box-shadow:var(--shadow);">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:24px;">
      <div class="brand-mark" style="width:34px;height:34px;">
        <svg width="15" height="21" viewBox="0 0 14 20">
          <rect x="4" y="0" width="6" height="14" rx="3" fill="var(--accent)"/>
          <rect x="4" y="16" width="6" height="4" rx="2" fill="var(--accent-2)"/>
        </svg>
      </div>
      <div>
        <div class="brand-name" style="font-size:16px;">Kursor</div>
        <div class="brand-sub">by Intech</div>
      </div>
    </div>

    <h1 style="margin:0 0 6px; font-size:19px; font-weight:600; color:var(--text);">{{.Client.Name}}</h1>
    <p style="margin:0 0 20px; font-size:13.5px; color:var(--muted);">{{t .Lang "oauth.consent_wants"}}</p>

    <div style="background:var(--panel-2); border-radius:10px; padding:14px; margin-bottom:20px;">
      <div style="font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;">{{t .Lang "oauth.consent_scopes"}}</div>
      {{range .Scopes}}<div style="font-family:var(--font-mono); font-size:12.5px; color:var(--text); padding:3px 0;">• {{.}}</div>{{end}}
    </div>

    <p style="margin:0 0 18px; font-size:12px; color:var(--muted);">{{t .Lang "oauth.signed_in_as"}} <b style="color:var(--text);">{{.Username}}</b></p>

    <form method="post" action="/oauth/authorize" style="display:flex; gap:10px;">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="client_id" value="{{.Params.ClientID}}">
      <input type="hidden" name="redirect_uri" value="{{.Params.RedirectURI}}">
      <input type="hidden" name="scope" value="{{.Params.Scope}}">
      <input type="hidden" name="state" value="{{.Params.State}}">
      <input type="hidden" name="code_challenge" value="{{.Params.CodeChallenge}}">
      <input type="hidden" name="code_challenge_method" value="{{.Params.CodeChallengeMethod}}">
      <input type="hidden" name="nonce" value="{{.Params.Nonce}}">
      <button type="submit" name="decision" value="deny" class="btn" style="flex:1;">{{t .Lang "oauth.deny"}}</button>
      <button type="submit" name="decision" value="allow" class="btn btn-primary" style="flex:1;">{{t .Lang "oauth.allow"}}</button>
    </form>

  </div>
</div>
</body>
</html>
{{end}}
