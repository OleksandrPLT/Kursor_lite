<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body {
      margin: 0;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      --bg: oklch(0.15 0.012 250);
      --panel: oklch(0.195 0.013 250);
      --panel-2: oklch(0.24 0.014 250);
      --border: oklch(0.32 0.014 250 / 0.65);
      --text: oklch(0.94 0.01 250);
      --muted: oklch(0.60 0.02 250);
      --accent: oklch(0.75 0.14 195);
      --accent-2: oklch(0.72 0.15 165);
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    ::placeholder { color: oklch(0.46 0.015 250); }
  </style>
</helmet>
<div style="width:1200px; height:68px; box-sizing:border-box; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:20px; margin-bottom:28px;">

  <div style="display:flex; align-items:center; gap:10px; width:400px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:9px 12px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span style="flex:1; font-family:var(--mono); font-size:12.5px; color:oklch(0.50 0.015 250);">Search sites, files, databases…</span>
    <span style="font-family:var(--mono); font-size:10.5px; color:var(--muted); background:var(--panel-2); border-radius:5px; padding:2px 6px;">⌘K</span>
  </div>

  <div style="display:flex; align-items:center; gap:16px;">
    <div style="position:relative; width:36px; height:36px; border-radius:10px; background:var(--panel); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span style="position:absolute; top:7px; right:8px; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px var(--panel);"></span>
    </div>

    <div style="width:1px; height:24px; background:var(--border);"></div>

    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:12px; font-weight:600; color:oklch(0.15 0.012 250);">OS</div>
      <div style="display:flex; flex-direction:column; line-height:1.25;">
        <span style="font-size:12.5px; color:var(--text); font-weight:500;">Oleksandr</span>
        <span style="font-family:var(--mono); font-size:10.5px; color:var(--muted);">Administrator</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1200,"height":68}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
